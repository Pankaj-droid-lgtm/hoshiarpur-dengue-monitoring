{% extends "base.html" %}{% block content %}<div class="page-heading"><div><p class="eyebrow">Operational map</p><h2>House surveillance map</h2><p>Only verified house coordinates are shown.</p></div></div><div id="map" class="map"></div><p class="form-note">Red: current larval positive. Orange: previously positive/reinspection. Green: currently clear. Yellow: pending.</p><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const map=L.map('map').setView([31.5143,75.9115],10);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors'}).addTo(map);const markers={{ markers|tojson }};markers.forEach(m=>L.circleMarker([m.latitude,m.longitude],{color:m.status,fillColor:m.status,fillOpacity:.8,radius:8}).addTo(map).bindPopup(`<strong>${m.house_code}</strong><br>${m.locality}<br>Last visit: ${m.last_visit}<br>Status: ${m.status}`));if(markers.length)map.fitBounds(markers.map(m=>[m.latitude,m.longitude]));</script>{% endblock %}
