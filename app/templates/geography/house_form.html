{% extends "base.html" %}
{% block content %}
<div class="page-heading"><div><p class="eyebrow">Operational house master</p><h2>Add known house</h2></div></div>
{% if not localities %}<p class="notice">Create approved blocks and villages first. No source address is automatically converted into a house.</p>{% endif %}
<form method="post" class="panel form-grid"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Permanent House ID <input name="house_code" placeholder="Generated automatically if left blank"><span class="form-note">Use an existing official ID when available; otherwise the system creates HP-HOS-000001 style IDs.</span></label><label>Village <select name="locality_id" required>{% for locality in localities %}<option value="{{ locality.id }}">{{ locality.block.name }} — {{ locality.sub_centre.name if locality.sub_centre else 'No sub-centre' }} — {{ locality.name }}</option>{% endfor %}</select></label><label>House number <input name="house_number"></label><label>Mobile number <input name="mobile_number" inputmode="numeric"></label><label class="full-width">Address/details <textarea name="address" required></textarea></label><div class="form-actions"><button type="submit" {% if not localities %}disabled{% endif %}>Save house</button><a class="button secondary" href="{{ url_for('geography.index') }}">Cancel</a></div></form>
{% endblock %}
